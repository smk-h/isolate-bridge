# GitHub 自动同步流水线
# 每次向 main 分支 push 后，自动同步代码到 GitHub 仓库
# 参考实现: https://cnb.cool/smk.h/embedded-mcp-toolkit

main:
  push:
    - stages:
        - name: sync to github
          image: tencentcom/git-sync
          imports: https://cnb.cool/sumu.k/secret-key/-/blob/main/access-token.yml
          settings:
            target_url: https://github.com/smk-h/isolate-bridge.git
            auth_type: https
            username: sumumm
            password: ${GITHUB_CNB_SYNC}
            force: true
