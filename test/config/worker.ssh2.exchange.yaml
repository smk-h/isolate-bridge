# 测试用 Worker 配置模板（executor=ssh2 + queue_mode=exchange）
# 由 test/test_work.mjs 复制到 <hgfs-root>/config/worker.yaml 使用。
# exchange 模式：Worker 扫 outbound/ 领任务、结果写 inbound/，心跳落 inbound/heartbeat.json。
# 结果保留期调大到 3600，避免内网拉回周期较长时结果被 GC 清掉。
# 连哪台设备由任务 device 字段决定（mcp-client 用 --device <name>）；未指定走 default。
# 需要连接的设备直接修改本文件的 devices 块。
queue_mode: exchange
executor: ssh2
exec_mode: command
result_ttl_sec: 3600
devices:
  default:
    host: 192.168.16.107
    port: 22
    username: root
    password: root
  board-107:
    host: 192.168.16.107
    port: 22
    username: root
    password: root